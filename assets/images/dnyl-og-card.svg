      <stop offset="50%" stop-color="#F5F5F0" />
      <stop offset="100%" stop-color="#E2C290" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#F8FAFC" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Base -->
  <rect width="1200" height="630" fill="#05060A" />
  <rect width="1200" height="630" fill="url(#bgGlow1)" />
  <rect width="1200" height="630" fill="url(#bgGlow2)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Architectural Frame -->
  <rect x="44" y="44" width="1112" height="542" rx="20" fill="#090C14" fill-opacity="0.65" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Corner Telemetry Ticks -->
  <path d="M 76 76 L 116 76 M 76 76 L 76 116" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <path d="M 1124 76 L 1084 76 M 1124 76 L 1124 116" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <path d="M 76 554 L 116 554 M 76 554 L 76 514" stroke="#E2C290" stroke-width="2" stroke-linecap="round" />
  <path d="M 1124 554 L 1084 554 M 1124 554 L 1124 514" stroke="#E2C290" stroke-width="2" stroke-linecap="round" />

