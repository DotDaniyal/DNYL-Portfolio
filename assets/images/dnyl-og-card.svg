  <text x="126" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="3.5" fill="#94A3B8">OFFICIAL BRAND &amp; DEVELOPER PORTFOLIO // DNYL.VERCEL.APP</text>

  <!-- Main Brand Badge & Monolith -->
  <text x="104" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="112" font-weight="900" letter-spacing="-2" fill="#F8FAFC">DNYL<tspan fill="#38BDF8">.</tspan></text>
  <text x="455" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" letter-spacing="-1" fill="#E2C290">// DANIYAL HAYAT</text>

  <!-- Accent Divider -->
