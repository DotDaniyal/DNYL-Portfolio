<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0B1325" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#05060A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#E2C290" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#05060A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#F5F5F0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E2C290" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
