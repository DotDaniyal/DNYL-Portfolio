  <text x="104" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="500" fill="#94A3B8">React &amp; TypeScript Web Platforms  ·  Native Kotlin Android Apps  ·  Google Gemini AI Systems</text>

